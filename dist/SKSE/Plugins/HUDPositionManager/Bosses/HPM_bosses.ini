; HUD Position Manager - who gets the boss bar, beyond its own rules.
;
; HPM already gives the boss bar to dragons and to anyone placed as their location's boss. Every .ini file in this folder
; adds to that, and so do the TrueHUD_*.ini files other mods ship for TrueHUD (Data\SKSE\Plugins\TrueHUD), in the
; same syntax:
;
;   Race = Plugin.esp:0xFormID           everyone of that race is a boss
;   NPC = Plugin.esp:0xFormID            that character is a boss
;   LocRefType = Plugin.esp:0xFormID     anyone placed with that location reference type is a boss
;   NPCBlacklist = Plugin.esp:0xFormID   that character is never a boss, whatever the other rules say
;
; The FormID is the record's ID inside its plugin, without the load order (an ESL's too). A line whose plugin is not
; loaded is skipped. ";" starts a comment. The files are read once, the first time a boss is looked for.
;
; Examples (remove the ";" in front to use one):
; Race = Skyrim.esm:0x0131F9 ; giants
; NPC = Skyrim.esm:0x01B07C ; Mercer Frey
[BossRecognition]
