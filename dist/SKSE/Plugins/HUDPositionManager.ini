; HUD Position Manager - its settings page in the Apocrypha Menu Framework edits this file for you.
; fX / fY move an element: a percentage of the screen (right / down positive), added to where the HUD puts it.
; fScale is times the size the HUD gives it, about the element's centre; fLength / fHeight stretch one side on top of it.
; bHide hides the element. iShow: 0 always (as the game decides), 1 only in combat, 2 only out of combat.
; bAlwaysVisible (the elements the game fades on its own): 1 keeps it shown while you play.
; sMoveWith names another element (Health, Stamina, ...) whose offset this one also takes: a widget beside a bar follows it.

[General]
; 1 = apply the layout below, 0 = every element back where the HUD puts it
bEnabled=1
; 1 = Magicka and Stamina move with Health (the three bars as one block)
bLinkBars=1
; 1 = widgets a UI places around the bars (Norden UI: STB Widgets, TrueHUD's bars) move with the bars
bLinkWidgets=1
; 1 = the bars stay shown while you play instead of fading out when full
bAlwaysVisible=0
; 1 = Free placement: the move sliders go past the screen's edges
bUnlocked=0
; Log level: 0 trace, 1 debug, 2 info, 3 warn, 4 error. Raise to 0 for a bug report.
uLogLevel=2

[Group]
; the Combined widgets tab: these elements (comma-separated keys) move as one by fX / fY
