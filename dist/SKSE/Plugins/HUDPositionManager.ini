; HUD Position Manager - its settings page in the Apocrypha Menu Framework edits this file for you.
; fX / fY move an element: a percentage of the screen (right / down positive), added to where the HUD puts it.
; fScale is times the size the HUD gives it, about the element's centre; fLength / fHeight stretch one side on top of it.
; bHide hides the element. iShow: 0 always (as the game decides), 1 only in combat, 2 only out of combat, 3 the HUD toggle,
; 4 only indoors, 5 only outdoors, 6 only with a weapon drawn, 8 only while sneaking, 9 (crosshair, sneak eye) when it matters.
; bAlwaysVisible (the elements the game fades on its own): 1 keeps it shown while you play.
; sMoveWith names another element (Health, Stamina, ...) whose offset this one also takes: a widget beside a bar follows it.

[General]
; 1 = apply the layout below, 0 = every element back where the HUD puts it
bEnabled=1
; 1 = Magicka and Stamina move with Health (the three bars as one block)
bLinkBars=1
; 1 = widgets a UI places around the bars (Norden UI: STB Widgets, TrueHUD's bars) move with the bars
bLinkWidgets=1
; 1 = the bars stay shown while you play instead of fading out when full
bAlwaysVisible=0
; 1 = Free placement: the move sliders go past the screen's edges
bUnlocked=0
; 1 = Show (in / out of combat) fades an element instead of hiding it at once
bFade=0
; fade speeds 1..20: half a full fade a second per step (10 = about 0.2 s, 5 = about 0.4 s)
iFadeInSpeed=10
iFadeOutSpeed=5
; opacity in percent of an element faded by Show: out of its moment (min) and in it (max)
iOpacityMin=0
iOpacityMax=100
; Log level: 0 trace, 1 debug, 2 info, 3 warn, 4 error. Raise to 0 for a bug report.
uLogLevel=2

[Immersive]
; the HUD toggle (ImmersiveHUD's way): 1 = a key shows and hides every element whose iShow is 3
bEnabled=0
; the key (a DirectInput scan code; 45 = X) and the controller button (an XInput mask; 0 = none) - set them on the page
iToggleKey=45
iToggleButton=0
; 1 = shown only while the key is held
bHoldMode=0
; seconds a press shows the HUD (0..10, 0 = a press toggles it)
fDisplaySeconds=0.0
; 1 = shown after loading
bStartVisible=0
; 1 = while shown, the bars the game fades when full stay shown
bHoldBarsWhenShown=1
; 1 = the toggle's elements also show in combat / while a weapon or spell is drawn
bShowInCombat=1
bShowWeaponDrawn=1

[PlayerBars]
; HPM's own Health / Magicka / Stamina bars (TrueHUD's player widget): 1 = on (hide the game's on their tabs)
bEnabled=0
; each bar: 0 never, 1 when it changes, 2 in combat, 3 when another bar shows, 4 always
uHealthMode=1
uMagickaMode=1
uStaminaMode=1
; 1 = the recent loss lingers behind the fill, this many seconds
bPhantom=1
fPhantomSeconds=0.75
; 1 = the mount's stamina while riding
bMountStamina=1
; 1 = Survival Mode's reduction drawn at the bar's end
bSurvivalPenalty=1
; 1 = the numbers on the bar
bShowValues=0

[RecentLoot]
; a short list of what you just picked up (TrueHUD's recent loot): 1 = on
bEnabled=0
; 1 = the game's own "X added" notification is hidden (0: both show)
bHideVanillaMessage=0
; how long an entry stays (seconds), and at most this many (1..6)
fSeconds=5.0
uMaxCount=6

[FloatingText]
; short text that rises over a character and fades - the damage you deal, and other mods' texts: 1 = on
bEnabled=0
; 1 = the damage you deal rises over the one you hit
bDamageNumbers=1
; how long a text stays (seconds, 0.5..5), how far it rises a second (0..120), its size, and smaller with distance
fSeconds=1.5
iRise=40
fScale=1.00
bScaleWithDistance=1

[BossBars]
; a large bar for the boss fighting you - a dragon, or its location's boss (TrueHUD's boss bar): 1 = on
bEnabled=0
; within this distance (game units); 1 = its level beside the bar
fMaxDistance=4096
bShowLevel=1

[InfoBars]
; health bars over the characters around you (TrueHUD's info bars): 1 = on
bEnabled=0
; enemies: 0 never, 1 in a fight or when hit, 2 always; followers: 0 never, 1 while you fight, 2 always; everyone else: 0 never, 1 when hit, 2 always
uDisplayHostiles=1
uDisplayTeammates=1
uDisplayOthers=1
bShowName=1
bShowLevel=1
; at most this many bars, out to this distance (game units), this high above the head, this big
uMaxCount=10
fMaxDistance=2048
fOffsetZ=20
fScale=1.00
; 1 = smaller farther away
bScaleWithDistance=1

