; HUD Position Manager - its settings page in the Apocrypha Menu Framework edits this file for you.
; Offsets are in HUD units (the HUD's 1280x720 stage) and are added to where the HUD itself puts the element.
; fScale is times the size the HUD gives it, about the element's centre. bHide hides the element.

[General]
; 1 = apply the layout below, 0 = every element back where the HUD puts it
bEnabled=1
; 1 = outline the element whose tab is open on the settings page
bHighlight=1
; Log level: 0 trace, 1 debug, 2 info, 3 warn, 4 error. Raise to 0 for a bug report.
uLogLevel=2

[Health]
fOffsetX=0
fOffsetY=0
fScale=1
bHide=0

